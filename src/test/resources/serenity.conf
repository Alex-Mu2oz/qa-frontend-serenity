# Configuracion global de la automatizacion.
# Centraliza el navegador, la URL base y las opciones de reporte, de modo que
# ninguna clase de Screenplay ni ningun .feature tenga datos de entorno.

webdriver {
  driver = chrome
  # Selenium Manager resuelve y descarga el driver adecuado para el Chrome
  # instalado, por lo que no hay binarios versionados en el repositorio.
  autodownload = true
  timeouts {
    implicitlywait = 3000
    fluentwait = 10000
  }
  capabilities {
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "disable-infobars",
        "disable-popup-blocking",
        "disable-notifications",
        "remote-allow-origins=*",
        # Evita el gestor de contrasenas y la alerta de credenciales filtradas
        # de Chrome, que interfieren con el formulario de login del sitio.
        "guest"
      ]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
      }
    }
  }
}

# Ejecucion sin ventana por defecto: mas rapida y estable.
# Para ver el navegador:  ./gradlew clean test -Dheadless.mode=false
headless.mode = true

serenity {
  project.name = "Prueba Tecnica QA Frontend - SauceDemo"
  take.screenshots = FOR_FAILURES
  report.show.step.details = true
  report.show.manual.tests = false
  restart.browser.for.each = scenario
  reports = "single-page-html"
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
  produccion {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
}
